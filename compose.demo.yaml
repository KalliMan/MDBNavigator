# The public demo: docker-compose.yml with these changes on top, and Caddy in front for HTTPS.
#   docker compose -f docker-compose.yml -f compose.demo.yaml up -d --build
# Strangers run SQL here, so only the sample database can be reached, only as the read-only demo_reader, and every
# run is limited. Invited guests get in through an emailed link (README, "Public demo setup"), so the MDBNAV_DEMO_*,
# MDBNAV_DOMAIN, MDBNAV_EMAIL_FROM and MDBNAV_SMTP_* values must be set in .env (see .env.example). What each part
# does and why: docs/security.md, "Public demo". Running it on a server: docs/hosting.md.

# Rotated logs, so a busy demo can't fill the disk: 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    environment:
      # Only Caddy's network may tell the app the visitor's address and that the request came over HTTPS. Keep the
      # same value and default as proxy-net's subnet below.
      ReverseProxy__TrustedNetworks__0: ${MDBNAV_PROXY_SUBNET:-172.30.254.0/24}
      # Only the bundled database.
      ConnectionGuard__Mode: AllowList
      ConnectionGuard__Allow__0: sample-db
      # Limits per run (README, "Configuration"). demo_reader's statement_timeout (30 s) stops a long statement with
      # PostgreSQL's clear message; a guest can SET it to 0, and then MaxRunSeconds stops the run. CommandTimeoutSeconds
      # stays off: it would race the statement_timeout and report only "Exception while reading from stream".
      QueryExecution__MaxRunSeconds: "60"
      QueryExecution__MaxRowsPerResultSet: "50000"
      QueryExecution__MaxRowsPerRun: "50000"
      QueryExecution__MaxRowBytes: "1048576"
      QueryExecution__MaxConcurrentQueries: "4"
      RateLimiting__MaxRunningQueriesPerUser: "1"
      RateLimiting__QueriesPerMinute: "20"
      ConnectionCache__SlidingExpirationMinutes: "60"
      # Guests: invite link, emailed sign-in link, 10-minute sessions (README, "Configuration", Demo). Self-hosted CAPTCHA
      # on the demo forms: no third-party account needed.
      Captcha__Provider: Altcha
      Demo__Enabled: "true"
      # Invite links: https://<address>/?code=<code>. Each code has a name, shown to the owner for every new visitor.
      # A blank code switches that link off (README, "Public demo setup").
      Demo__InviteCodes__0__Name: LinkedIn
      Demo__InviteCodes__0__Code: ${MDBNAV_DEMO_CODE_LINKEDIN:-}
      Demo__InviteCodes__1__Name: CV
      Demo__InviteCodes__1__Code: ${MDBNAV_DEMO_CODE_CV:-}
      Demo__InviteCodes__2__Name: Friends
      Demo__InviteCodes__2__Code: ${MDBNAV_DEMO_CODE_FRIENDS:-}
      Demo__InviteCodes__3__Name: GitHub
      Demo__InviteCodes__3__Code: ${MDBNAV_DEMO_CODE_GITHUB:-}
      Demo__OwnerEmail: ${MDBNAV_DEMO_OWNER_EMAIL:?set MDBNAV_DEMO_OWNER_EMAIL in .env}
      Demo__ContactEmail: ${MDBNAV_DEMO_CONTACT_EMAIL:?set MDBNAV_DEMO_CONTACT_EMAIL in .env}
      Demo__Connection__Name: Sample database (Pagila)
      Demo__Connection__ServerName: sample-db
      Demo__Connection__Port: "5432"
      Demo__Connection__UserName: demo_reader
      Demo__Connection__Password: ${MDBNAV_DEMO_READER_PASSWORD:-demo-reader}
      Demo__Connection__DatabaseName: pagila
      # The sign-in links go out by email.
      Email__Delivery: Smtp
      Email__FrontendBaseUrl: https://${MDBNAV_DOMAIN:?set MDBNAV_DOMAIN in .env}
      Email__FromAddress: ${MDBNAV_EMAIL_FROM:?set MDBNAV_EMAIL_FROM in .env}
      Email__Smtp__Host: ${MDBNAV_SMTP_HOST:-smtp-relay.brevo.com}
      Email__Smtp__Port: ${MDBNAV_SMTP_PORT:-587}
      Email__Smtp__Username: ${MDBNAV_SMTP_USERNAME:?set MDBNAV_SMTP_USERNAME in .env}
      Email__Smtp__Password: ${MDBNAV_SMTP_PASSWORD:?set MDBNAV_SMTP_PASSWORD in .env}
    networks:
      - default
      - sample-db-net
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging

  sample-db:
    # tini as PID 1, for the settings guard that runs beside PostgreSQL.
    init: true
    entrypoint: ["/usr/local/share/mdbnavigator/demo-entrypoint.sh"]
    command:
      - postgres
      # Who may log in: demo_reader from the app's network, nobody else over the network.
      - -c
      - hba_file=/usr/local/share/mdbnavigator/demo-pg_hba.conf
      # Disk for sorts and hashes, per session. Only the superuser can change it.
      - -c
      - temp_file_limit=1GB
    # Only on the internal network: no way out to the internet, and only the app can reach it.
    networks:
      - sample-db-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *logging

  caddy:
    # HTTPS for the demo, then on to the app (docker/caddy/Caddyfile). The minor version is pinned; deploy/update.sh
    # pulls its patch releases every week.
    image: caddy:2.11-alpine
    environment:
      MDBNAV_DOMAIN: ${MDBNAV_DOMAIN:?set MDBNAV_DOMAIN in .env}
      # Other names that lead to the demo. Never empty: Caddy refuses a site without a name.
      MDBNAV_REDIRECT_DOMAINS: ${MDBNAV_REDIRECT_DOMAINS:-www.${MDBNAV_DOMAIN}}
    ports:
      - "${MDBNAV_HTTP_PORT:-80}:80"
      - "${MDBNAV_HTTPS_PORT:-443}:443"
      # HTTP/3.
      - "${MDBNAV_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account. Keep this volume: Let's Encrypt issues the same certificate only a few
      # times a week.
      - caddy-data:/data
      - caddy-config:/config
    # Only the app's side: Caddy never sees the database.
    networks:
      - proxy-net
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *logging

networks:
  sample-db-net:
    internal: true
  # Caddy and the app only. A fixed range, so the app can trust exactly this network's forwarded headers.
  proxy-net:
    ipam:
      config:
        - subnet: ${MDBNAV_PROXY_SUBNET:-172.30.254.0/24}

volumes:
  caddy-data:
  caddy-config:
