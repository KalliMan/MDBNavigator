# Who may log in to the public demo's database. compose.demo.yaml points hba_file here.
# TYPE  DATABASE  USER         ADDRESS        METHOD

# Inside the container: the init scripts, the settings guard, docker compose exec.
local   all       all                         trust
# The health check (pg_isready over TCP, so it waits for the init scripts). 127.0.0.1 is reachable only from inside.
host    pagila    sample       127.0.0.1/32   trust
# Guests, through the app, from the internal network sample-db is on. No password check: any role can change its
# own password, and a guest who did would lock everyone else out. Only the app is on that network.
host    pagila    demo_reader  samenet        trust
# Everything else over the network, the superuser too, even with the right password.
host    all       all          all            reject
